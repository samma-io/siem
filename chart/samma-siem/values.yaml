# samma-siem: the Kubernetes SIEM. The message contract is
# samma-io/aws-siem docs/contracts/detection-alert-v1.md, "NATS transport",
# and docs/contracts/nats-transport.md.
#
#   ingester-<source> -> samma.raw.<lane> -> vector -> samma.logs.<lane> ->
#   detection-engine-<lane> -> samma.alerts.<lane> -> alert-destination -> Postgres
#
#   samma.logs.<lane>, samma.alerts.> -> siem-storage -> Postgres siem_events, S3 archive
#   quickwit (search, Postgres metastore, S3 index) <- grafana (dashboards)
#
# Nothing here is exposed outside the cluster: every Service is ClusterIP and
# the chart renders no Ingress.

# Lanes captured by the streams (README, "Lanes"). Only deployed lanes: a
# lane listed here gets its subjects in SIEM_RAW and SIEM_LOGS and its
# durable consumers. Do not use a wildcard. The legacy pipeline publishes
# samma.logs.k8s and samma.logs.k8s.audit (~11 MiB/min) on core NATS, and a
# stream on samma.logs.> would fill its byte cap within the hour.
#
# An entry is a lane name, or {name, raw} where raw: false leaves the lane
# out of SIEM_RAW (no samma.raw.<lane>, no vector-<lane> consumer). The k8s
# and scanner lanes of the contract have no raw records.
#   - workspace
#   - {name: k8s, raw: false}
lanes:
  - workspace

# The ingester: SaaS audit-log puller (samma-io/ingester), one Deployment
# per source running `daemon` with INGESTER_TRANSPORT=nats. Each source gets
# a worker consumer ingester-<source> on samma.ingester.slices.<source>
# (stream INGESTER_SLICES) and publishes to samma.raw.<lane>. Watermarks
# live in Postgres (ingester_checkpoint, created at start).
#
# Only google-workspace works on Kubernetes so far: Slack, 1Password and
# Cloudflare still read their token from SSM (ingester README, "Running on
# Kubernetes (NATS)").
ingester:
  enabled: true
  sources:
    - google-workspace
  image: ghcr.io/samma-io/ingester
  tag: 89ed408
  digest: ""
  pullPolicy: IfNotPresent
  # Defaults for every source; a source's entry in perSource wins.
  replicas: 0
  scheduleInterval: 10m
  reconcileInterval: 1h
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Per source, keyed by the name in sources:
  #   replicas           at most 1: a second replica only contends for the leases
  #   scheduleInterval, reconcileInterval
  #   existingSecret     the source's credential Secret, by name, mounted
  #                      read-only at /var/run/secrets/ingester
  #   secretOptional     start without the Secret (true for replicas: 0)
  #   env                extra INGESTER_* settings of the source (README,
  #                      "Configuration"); an empty value is left out
  perSource:
    google-workspace:
      # 0 until there is a credential. To go live: create the Secret (key
      # key.json, a service-account key that may impersonate the delegated
      # service account), set the two env values, then replicas: 1.
      replicas: 0
      existingSecret: ingester-google
      secretOptional: true
      env:
        # The Workspace admin to act as (a dedicated service user with the
        # Reports privilege) and the service account holding the
        # domain-wide delegation grant. Required with replicas: 1.
        INGESTER_GWS_SUBJECT: ""
        INGESTER_GCP_TARGET_SERVICE_ACCOUNT: ""

# NATS: the official chart (nats-io/k8s) with JetStream on a file store.
# false installs no NATS; set externalNats.url to use one you run already.
nats:
  enabled: true
  # The subchart's own images, pinned by digest (the digest wins over the
  # tag, which stays as the readable name).
  container:
    image:
      repository: nats
      tag: 2.15.0-alpine
      digest: "sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4"
  reloader:
    image:
      repository: natsio/nats-server-config-reloader
      tag: 0.23.0
      digest: "sha256:64cb6c858e794906d3167378e02b7e0feb83c4e14c07b371eb8d921ef8c4a60b"
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          # The stream byte caps below must fit in this, with headroom. Raise
          # both together, never the caps alone.
          size: 1Gi
          storageClassName:
  # The upstream chart's always-on nats-box Deployment. The streams Job
  # brings its own nats-box; turn this on for a shell to poke at streams.
  natsBox:
    enabled: false

# Used only with nats.enabled: false. With nats.enabled the URL is the
# subchart's Service, nats://<release>-nats.<namespace>.svc:4222.
externalNats:
  url: ""   # e.g. nats://nats.samma.svc:4222

# Streams and consumers, created by a post-install/post-upgrade hook Job
# that runs `nats stream add|edit --config` and `nats consumer add|edit
# --config` from the ConfigMap <release>-streams. Idempotent: what is missing
# is created, what exists is edited to match.
#
# Stream names and subjects are fixed by the contract. Ages are a whole
# number with s, m, h or d; sizes a whole number with B, KiB, MiB, GiB or
# TiB. The defaults are the numbers running on v2 (samma-io/deploy siem/).
# The sum of the maxBytes (400 + 200 + 100 + 10 MiB = 710 MiB) must fit the
# JetStream PVC (nats.config.jetstream.fileStore.pvc.size, 1Gi).
streams:
  enabled: true
  # SIEM_RAW: samma.raw.<lane>, raw vendor records from the ingester. The 2h
  # duplicate window absorbs a reconcile pass re-reading the last hour.
  raw:
    maxAge: 24h
    maxBytes: 100MiB
    duplicateWindow: 2h
  # SIEM_LOGS: samma.logs.<lane>, filtered records from Vector.
  logs:
    maxAge: 7d
    maxBytes: 400MiB
    duplicateWindow: 2m
  # SIEM_ALERTS: samma.alerts.>, detection.alert.v1 documents. A republish
  # of the same alert id inside the window is dropped.
  alerts:
    maxAge: 30d
    maxBytes: 200MiB
    duplicateWindow: 2m
  # INGESTER_SLICES: samma.ingester.slices.>, a work queue (a message is
  # gone once acked). Retention cannot be changed after creation.
  ingesterSlices:
    maxAge: 24h
    maxBytes: 10MiB
    duplicateWindow: 2h

# Durable pull consumers, explicit ack. Exhausting maxDeliver is the DLQ of
# this transport: the message stays in the stream until its age or byte
# limit and JetStream emits a max-deliveries advisory.
consumers:
  maxDeliver: 5
  ackWait:
    # vector-<lane> on SIEM_RAW. Vector acks once the filtered record is
    # stored in SIEM_LOGS.
    vector: 60s
    # detection-engine-<lane> on SIEM_LOGS. Must equal the engine's
    # ENGINE_VISIBILITY_TIMEOUT (300s default).
    detectionEngine: 300s
    # alert-destination on SIEM_ALERTS. Must exceed
    # ALERTDEST_DAEMON_MESSAGE_TIMEOUT (60s default).
    alertDestination: 120s
    # ingester-<source> on INGESTER_SLICES. Must exceed the ingester
    # daemon's 15-minute message timeout.
    ingester: 20m
    # storage-logs on SIEM_LOGS (siem-storage, postgres backend). Messages
    # are acked once their batch (storage.batchSize, storage.batchWait) is
    # committed; the service's own default when it creates it is 30s.
    storage: 60s
    # storage-s3-logs on SIEM_LOGS. A message stays unacked until the object
    # holding it is written, at the latest after storage.s3.flushInterval:
    # must exceed it. The service uses the interval plus one minute.
    storageS3Logs: 6m
    # storage-s3-alerts on SIEM_ALERTS: one object per alert, acked after the
    # PutObject. The service's own value.
    storageS3Alerts: 2m
    # vector-alerts-quickwit on SIEM_ALERTS, only with vector.quickwitAlerts.
    # Above the alerts sink's worst case: a 5s batch, then a 30s request
    # retried for up to 30s.
    vectorAlertsQuickwit: 120s

# The image of the streams Job. Takes image, tag and digest: a digest
# renders image@digest and wins over the tag.
natsBox:
  image: natsio/nats-box
  tag: "0.18.1"
  digest: "sha256:abb33f930d25425dce3472039a0ffac7427344f7c0b7ef9849b9fe45bb8895fe"
  pullPolicy: IfNotPresent
  # nats-box has no user of its own; the Job runs as this unprivileged uid
  # with a read-only root filesystem and HOME on an emptyDir.
  runAsUser: 65532
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# S3-compatible object store for the archive (nats-transport.md, "Object
# archive"): s3://<bucket>/<lane>/date=YYYY-MM-DD/<name>.log.gz, written by
# siem-storage (and alerts/log_source=<lane>/...), with Quickwit's index under
# quickwit/indexes. With minio.enabled the defaults point at the bundled
# MinIO; set minio.enabled: false and fill these in for any other S3.
s3:
  # Empty with minio.enabled: http://<release>-minio.<namespace>.svc:9000.
  endpoint: ""
  bucket: samma-siem-archive
  region: us-east-1
  # A Secret with the access key id and secret access key under the keys
  # below. Empty with minio.enabled: the MinIO root Secret (keys rootUser
  # and rootPassword), which is minio.existingSecret or <release>-minio.
  existingSecret: ""
  accessKeyIdKey: accessKeyId
  secretAccessKeyKey: secretAccessKey
  # Path-style addressing (http://host/bucket), which MinIO needs. false for
  # AWS S3 virtual-hosted buckets.
  forcePathStyle: true

# The bucket-create hook Job (mc mb --ignore-existing), rendered only with
# minio.enabled. The image has no shell; mc reads the endpoint and
# credentials from MC_HOST_s3, so the access key and secret must be
# URL-safe (MinIO's generated ones are alphanumeric).
minioClient:
  image: cgr.dev/chainguard/minio-client
  tag: latest
  digest: "sha256:59f1924e417b6fcfdc0aca321e3bdebe8a56fd0efa7da80037d5eb65a203d687"
  pullPolicy: IfNotPresent
  runAsUser: 65532
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# MinIO: the official chart (charts.min.io), standalone with one PVC. MinIO
# no longer publishes images on quay.io or Docker Hub, so the image is
# Chainguard's build, pinned by digest. It keeps the paths the chart's
# command expects (/bin/sh, /usr/bin/docker-entrypoint.sh).
minio:
  enabled: true
  image:
    repository: cgr.dev/chainguard/minio
    tag: "latest@sha256:268d68a2a3b6fc65f905a61f84d7eab6345ce6bff14f551e2b028ec31e6a1341"
    pullPolicy: IfNotPresent
  # Only used by the upstream post-install jobs, which this chart turns off
  # (users, policies and buckets are empty). The upstream default no longer
  # pulls.
  mcImage:
    repository: cgr.dev/chainguard/minio-client
    tag: "latest@sha256:59f1924e417b6fcfdc0aca321e3bdebe8a56fd0efa7da80037d5eb65a203d687"
  mode: standalone
  replicas: 1
  # Root credentials. Empty: kept from the Secret already in the cluster,
  # else generated at install. `helm template` has no cluster to read from
  # and generates new ones on every render; use existingSecret (keys
  # rootUser, rootPassword) when a GitOps tool renders the chart.
  rootUser: ""
  rootPassword: ""
  existingSecret: ""
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # The upstream default creates a consoleAdmin user console/console123.
  users: []
  policies: []
  svcaccts: []
  buckets: []
  service:
    type: ClusterIP
  consoleService:
    type: ClusterIP
  ingress:
    enabled: false
  consoleIngress:
    enabled: false

# The existing TimescaleDB, through a Secret with a libpq DSN: the
# siem-postgres Secret of samma-io/deploy siem/ (database and role "siem",
# never the scan_results database). The chart deploys no Postgres and never
# creates this Secret. The ingester (ingester_checkpoint) and
# alert-destination (alert_ledger, siem_alerts) mount the key as a file;
# siem-storage (siem_events) reads it into STORAGE_POSTGRES_DSN, as it has no
# file setting. Grafana never gets this Secret (grafana.existingSecret).
postgres:
  existingSecret: siem-postgres
  dsnKey: dsn

# Shared by the workloads below. Every pod runs as this non-root uid (Grafana
# as grafana.runAsUser)
# with a read-only root filesystem, no capabilities, the RuntimeDefault
# seccomp profile and no service account token.
workloads:
  runAsUser: 65532
  # The images are linux/amd64 only.
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  # Pull Secrets, by name, for private ghcr.io packages.
  imagePullSecrets: []
  podAnnotations: {}

# Vector (samma-io/vector): samma.raw.<lane> (SIEM_RAW) -> envelope VRL ->
# samma.logs.<lane> (SIEM_LOGS). One Deployment, rendered when a lane has
# raw records. The config is baked into the image; the baked
# vector-k8s.yaml reads the workspace lane (consumer vector-workspace). A
# raw lane other than workspace needs an image whose config reads it.
#
# With quickwit.enabled the chart adds the image's overlay
# /etc/vector/vector-k8s-quickwit.yaml (filtered Workspace records into the
# logs-saas index, best-effort) and sets QUICKWIT_URL to this release's
# Quickwit Service. f2f2dea predates the overlays and would not start with
# them: with quickwit.enabled, set tag to an image built from samma-io/vector
# main at 34806c1 or later.
vector:
  enabled: true
  image: ghcr.io/samma-io/vector
  tag: f2f2dea
  digest: ""
  pullPolicy: IfNotPresent
  replicas: 1
  configPath: /etc/vector/vector-k8s.yaml
  # With quickwit.enabled, also index detection alerts into Quickwit (overlay
  # vector-k8s-quickwit-alerts.yaml). The streams Job then creates consumer
  # vector-alerts-quickwit on SIEM_ALERTS (filter samma.alerts.>, AckWait
  # consumers.ackWait.vectorAlertsQuickwit); Vector does not start without
  # it. Refused without quickwit.enabled.
  quickwitAlerts: false
  # Extra env, name: value. NATS_URL and QUICKWIT_URL are set by the chart.
  env: {}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# detection-engine (samma-io/detection-engine): one Deployment per entry in
# lanes, bound to consumer detection-engine-<lane> on SIEM_LOGS, publishing
# detection.alert.v1 to samma.alerts.<lane>. The rules are baked into the
# image (/rules). ENGINE_VISIBILITY_TIMEOUT is consumers.ackWait.detectionEngine.
#
# d5d7439 knows the SaaS lanes only. The k8s and scanner lanes (and their
# rules) are in detection-engine main from 0c5b5ce on; set tag to an image
# built from there before adding them.
detectionEngine:
  enabled: true
  image: ghcr.io/samma-io/detection-engine
  tag: d5d7439
  digest: ""
  pullPolicy: IfNotPresent
  replicas: 1
  workers: 2
  # Extra env, name: value (e.g. ENGINE_LOG_LEVEL: debug).
  env: {}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# alert-destination (samma-io/alert-destination): samma.alerts.> (consumer
# alert-destination on SIEM_ALERTS) -> routes -> Postgres siem_alerts. Its
# delivery ledger is the alert_ledger table in the same database.
alertDestination:
  enabled: true
  image: ghcr.io/samma-io/alert-destination
  tag: 779befa
  digest: ""
  pullPolicy: IfNotPresent
  replicas: 1
  # ALERTDEST_DAEMON_MESSAGE_TIMEOUT. Must stay below
  # consumers.ackWait.alertDestination.
  messageTimeout: 60s
  # The routing table (ConfigMap <release>-alert-routes, mounted at
  # ALERTDEST_ROUTES_PATH). Empty: everything to the postgres destination,
  # table siem_alerts, with require_slack following slack.enabled. Set it to
  # a whole table (README "Routing table" of alert-destination) to replace it.
  routes: ""
  # Slack and GitHub. 779befa builds only the postgres destination in its
  # nats transport and refuses a table that names slack or github: routing to
  # them needs tag set to an image built from samma-io/alert-destination
  # main at e9987eb or later. slack.enabled is require_slack of the default
  # table (and so needs routes); slack.enabled, or routes naming slack or
  # github, needs existingSecret. The chart refuses either without it.
  slack:
    enabled: false
  # Secret, by name, with the tokens under the keys slack-token (Slack bot
  # token) and github-token (GitHub fine-grained PAT), mounted whole and
  # read-only at /var/run/secrets/alert-destination. With it set the chart
  # sets ALERTDEST_SLACK_TOKEN_FILE and ALERTDEST_GITHUB_TOKEN_FILE to those
  # two files; a key no route uses may be left out of the Secret. Never put a
  # token in values.
  existingSecret: ""
  # Extra env, name: value (e.g. ALERTDEST_LOG_LEVEL: debug).
  env: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# siem-storage (samma-io/siem-storage): stores SIEM_LOGS in Postgres
# siem_events (consumer storage-logs) and archives SIEM_LOGS and SIEM_ALERTS
# to S3 (consumers storage-s3-logs, storage-s3-alerts). It never writes
# siem_alerts: that table is alert-destination's. The streams Job creates
# the consumers of the configured backends.
storage:
  enabled: true
  # postgres, s3 or both. elasticsearch, which the service also has, is not
  # offered here: there is no Elasticsearch in the Kubernetes SIEM.
  backends: [postgres, s3]
  image: ghcr.io/samma-io/siem-storage
  # Built by siem-storage CI (build.yml, tag sha-<short sha>) from main at
  # 6c3f143, the merge of the S3 backend.
  tag: sha-6c3f143
  digest: ""
  pullPolicy: IfNotPresent
  replicas: 1
  # STORAGE_BATCH_SIZE / STORAGE_BATCH_WAIT of the postgres backend.
  batchSize: 100
  batchWait: 1s
  # STORAGE_EVENTS_RETENTION: TimescaleDB retention of siem_events, a
  # Postgres interval.
  eventsRetention: 30 days
  s3:
    # STORAGE_S3_FLUSH_INTERVAL. Must stay below
    # consumers.ackWait.storageS3Logs.
    flushInterval: 5m
    # STORAGE_S3_FLUSH_BYTES: write a lane's object at this uncompressed size.
    flushBytes: 16777216
  # Extra env, name: value (STORAGE_* from the service's README).
  env: {}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Quickwit (samma-io/quickwit) in QW_MODE=k8s: search over the logs-saas,
# logs-k8s, logs-scanner and alerts indexes (created at start by the image's
# auto-bootstrap), metastore in Postgres, index data on S3. ClusterIP Service
# on 7280 only. Quickwit has no authentication: reach it with kubectl
# port-forward (README).
#
# Off by default: its image is pushed by hand (aws-siem hack/build-images.sh),
# so there is no tag to default to, and the metastore Secret must exist.
quickwit:
  enabled: false
  image: ghcr.io/samma-io/quickwit
  # Required: an image built from samma-io/quickwit main at 10d8377 or later
  # (QW_MODE=k8s). There is no default.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # 1 only: the pod has no peers, a second replica would be a second cluster.
  replicas: 1
  metastore:
    # Required. A Secret with QW_METASTORE_URI, postgres://user:pass@host:5432/db,
    # under the key below. A database of its own (Quickwit runs its own
    # migrations in it), not the siem database's DSN.
    existingSecret: ""
    uriKey: uri
  # QW_DEFAULT_INDEX_ROOT_URI. Empty: s3://<s3.bucket>/quickwit/indexes.
  indexRootUri: ""
  # A NetworkPolicy admitting port 7280 only from this release's Grafana and
  # Vector pods (Quickwit README, "Security"). Needs a CNI that enforces it;
  # kubectl port-forward is not affected.
  networkPolicy:
    enabled: true
  # Extra env, name: value (QW_* from the image's README).
  env: {}
  # QW_DATA_DIR is an emptyDir of this size: staged splits and the ingest WAL.
  dataSizeLimit: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

# Grafana (samma-io/grafana) with the Kubernetes provisioning tree
# (GF_PATHS_PROVISIONING=/etc/grafana/provisioning-k8s): the Quickwit
# datasources at the quickwit Service, and siem_alerts through a read-only
# Postgres role. ClusterIP Service on 3000 only; reach it with kubectl
# port-forward (README). Nothing persists: dashboards and datasources are
# provisioned from the image, and the data directory is an emptyDir.
#
# Off by default: the image is pushed by hand and needs its Secret.
grafana:
  enabled: false
  image: ghcr.io/samma-io/grafana
  # Required: an image built from samma-io/grafana with provisioning-k8s
  # (samma-io/grafana#3). There is no default.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  replicas: 1
  # The image's own user, who owns its plugins and provisioning files.
  runAsUser: 472
  # Required. A Secret of Grafana's own with the admin password and the
  # read-only database login (Grafana README, "The read-only database
  # user"). Never postgres.existingSecret: that is the siem role, which
  # writes the tables; the chart refuses it.
  existingSecret: ""
  # Key names in that Secret. port and sslmode may be left out of it (the
  # image defaults, 5432 and require).
  keys:
    adminUser: admin-user
    adminPassword: admin-password
    postgresHost: postgres-host
    postgresPort: postgres-port
    postgresDatabase: postgres-database
    postgresUser: postgres-user
    postgresPassword: postgres-password
    postgresSslmode: postgres-sslmode
  # Extra env, name: value (GF_* settings).
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
