apiVersion: v2
name: samma-siem
description: The Kubernetes SIEM of Samma (ingester, Vector, detection-engine, alert-destination over NATS JetStream). This version installs the foundation only - JetStream, the streams and consumers, and an optional MinIO.
type: application
# version and appVersion move together.
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
home: https://samma.io
sources:
  - https://github.com/samma-io/siem
  - https://github.com/samma-io/aws-siem
maintainers:
  - name: Mattias Hemmingsson
    url: https://github.com/mattiashem
keywords:
  - security
  - siem
  - nats
  - jetstream
# Exact versions; Chart.lock is committed and charts/*.tgz is not (run
# `helm dependency build chart/samma-siem` before installing from git).
dependencies:
  - name: nats
    version: 2.15.0
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
