# Environment: NATS_URL (required), VRL_DIR (default /etc/k8s-log-router),
# PUSH_TOKEN_<LANE> (optional, one per push lane; see push.vrl).
data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
# A shipper's batch is acked only once JetStream has stored it.
acknowledgements:
  enabled: true

sources:
  fluent_forward:
    type: fluent
    address: 0.0.0.0:24224
  vector_agents:
    type: vector
    address: 0.0.0.0:6000
  # Push lanes: a tool POSTs JSON (one object, or an array of objects) to
  # /v1/<lane> with "Authorization: Bearer <token>". A lane exists only while
  # PUSH_TOKEN_<LANE> is set (upper case, - as _); anything else is a 401.
  push:
    type: http_server
    address: 0.0.0.0:8080
    path: /v1
    strict_path: false
    path_key: _push_path
    method: POST
    decoding:
      codec: json
    auth:
      strategy: custom
      source: |
        m, err = parse_regex(string(.path) ?? "", r'^/v1/(?P<lane>[a-z0-9]+(-[a-z0-9]+)*)$')
        lane = if err == null { string(m.lane) ?? "" } else { "" }
        token = if lane != "" { get_env_var("PUSH_TOKEN_" + upcase(replace(lane, "-", "_"))) ?? "" } else { "" }
        token != "" && (string(.headers.authorization) ?? "") == "Bearer " + token

transforms:
  k8s_route:
    type: remap
    inputs: [fluent_forward, vector_agents]
    file: ${VRL_DIR:-/etc/k8s-log-router}/k8s-router.vrl
    drop_on_abort: true
    drop_on_error: true
  push_route:
    type: remap
    inputs: [push]
    file: ${VRL_DIR:-/etc/k8s-log-router}/push.vrl
    drop_on_abort: true
    drop_on_error: true

sinks:
  nats_svc:
    type: nats
    inputs: [k8s_route, push_route]
    url: ${NATS_URL}
    connection_name: k8s-log-router
    # source is set by the VRL from the allowlist only, never from the log.
    subject: "samma.logs.svc.{{ source }}"
    jetstream: true
    encoding:
      codec: json
    buffer:
      type: memory
      max_events: 10000
      when_full: block

