# Every workload on: the all-lanes set plus siem-storage on both backends,
# Quickwit and Grafana. The tags and Secrets are placeholders for the render
# only; nothing in CI pulls them. Used by CI (helm lint, helm template,
# hack/check-chart.sh).
lanes:
  - workspace
  - {name: k8s, raw: false}
  - {name: scanner, raw: false}
storage:
  enabled: true
  backends: [postgres, s3]
quickwit:
  enabled: true
  tag: ci-placeholder
  metastore:
    existingSecret: siem-quickwit-metastore
grafana:
  enabled: true
  tag: ci-placeholder
  existingSecret: siem-grafana
# Vector into Quickwit, logs and alerts (consumer vector-alerts-quickwit).
vector:
  quickwitAlerts: true
# Slack and GitHub routes with their token Secret (keys slack-token,
# github-token).
alertDestination:
  existingSecret: siem-alert-destination
  routes: |
    require_slack: false
    routes:
      - level: critical
        log_source: "*"
        deliveries:
          - {to: postgres, target: siem_alerts}
          - {to: slack, target: C0EXAMPLE1}
          - {to: github, target: example-org/detections}
      - {level: "*", log_source: "*", deliveries: [{to: postgres, target: siem_alerts}]}
    default:
      deliveries: [{to: postgres, target: siem_alerts}]
