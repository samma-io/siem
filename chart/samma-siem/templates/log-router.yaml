{{- $services := include "samma-siem.serviceLanes" . | fromJsonArray -}}
{{- if and $services .Values.logRouter.enabled }}
{{- /*
k8s-log-router (samma-io/k8s-log-router): pod logs from node shippers ->
allowlist (serviceLanes) -> samma.logs.svc.<lane> (SIEM_SERVICES). The
config is files/k8s-log-router/, a verbatim copy of that repo's router/;
the chart only replaces the VRL's lanes object with the log lanes of
serviceLanes and push.vrl's push_parsers with its push lanes.
*/ -}}
{{- $v := .Values.logRouter -}}
{{- $name := include "samma-siem.workloadName" (dict "root" . "suffix" "k8s-log-router") -}}
{{- $allow := dict -}}
{{- $push := dict -}}
{{- range $services }}
{{- if .push }}{{ $_ := set $push .name .parse }}{{ else }}{{ $_ := set $allow .name (dict "namespaces" .namespaces "parse" .parse) }}{{ end -}}
{{- end -}}
{{- if and $push (not $v.push.existingSecret) -}}
{{- fail (printf "push lanes (%s) need logRouter.push.existingSecret: a Secret with PUSH_TOKEN_<LANE> for each" (join ", " (keys $push | sortAlpha))) -}}
{{- end -}}
{{- $pushVrl := .Files.Get "files/k8s-log-router/push.vrl" -}}
{{- $pushRe := "(?s)\npush_parsers = \\{.*?\n\\}\n" -}}
{{- if not (regexMatch $pushRe $pushVrl) }}{{ fail "files/k8s-log-router/push.vrl has no push_parsers = { ... } block to replace" }}{{ end -}}
{{- $pushVrl = regexReplaceAll $pushRe $pushVrl (printf "\npush_parsers = %s\n" (toJson $push)) -}}
{{- $vrl := .Files.Get "files/k8s-log-router/k8s-router.vrl" -}}
{{- $lanesRe := "(?s)\nlanes = \\{.*?\n\\}\n" -}}
{{- if not (regexMatch $lanesRe $vrl) }}{{ fail "files/k8s-log-router/k8s-router.vrl has no lanes = { ... } block to replace" }}{{ end -}}
{{- $vrl = regexReplaceAll $lanesRe $vrl (printf "\nlanes = %s\n" (toJson $allow)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-log-router
data:
  vector.yaml: |
    {{- .Files.Get "files/k8s-log-router/vector.yaml" | nindent 4 }}
  k8s-router.vrl: |
    {{- $vrl | nindent 4 }}
  push.vrl: |
    {{- $pushVrl | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-log-router
  annotations:
    {{- include "samma-siem.argocdWorkloadWave" . | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "samma-siem.selectorLabels" (dict "root" . "component" "k8s-log-router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "samma-siem.labels" . | nindent 8 }}
        app.kubernetes.io/component: k8s-log-router
      annotations:
        # The allowlist is read at start: a change rolls the pods.
        checksum/config: {{ printf "%s%s%s" (.Files.Get "files/k8s-log-router/vector.yaml") $vrl $pushVrl | sha256sum }}
        {{- with .Values.workloads.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "samma-siem.workloadPodSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: vector
          image: {{ include "samma-siem.workloadImage" (dict "name" "logRouter" "values" $v) }}
          imagePullPolicy: {{ $v.pullPolicy }}
          args: ["--config", "/etc/k8s-log-router/vector.yaml"]
          env:
            - name: NATS_URL
              value: {{ include "samma-siem.natsUrl" . | quote }}
            - name: VRL_DIR
              value: /etc/k8s-log-router
          {{- with $v.push.existingSecret }}
          # Push lane tokens: PUSH_TOKEN_<LANE>. A lane without one gets 401.
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: fluent
              containerPort: 24224
            - name: vector
              containerPort: 6000
            - name: push
              containerPort: 8080
            - name: vector-api
              containerPort: 8686
          livenessProbe:
            httpGet:
              path: /health
              port: vector-api
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: vector-api
            periodSeconds: 10
          securityContext:
            {{- include "samma-siem.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/k8s-log-router
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
          emptyDir: {}
---
# Where node shippers send pod logs. Inside the cluster only.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-log-router
spec:
  type: ClusterIP
  selector:
    {{- include "samma-siem.selectorLabels" (dict "root" . "component" "k8s-log-router") | nindent 4 }}
  ports:
    - name: fluent
      port: 24224
      targetPort: fluent
    - name: vector
      port: 6000
      targetPort: vector
    - name: push
      port: 8080
      targetPort: push
{{- end }}
