{{- if .Values.alertDestination.enabled }}
{{- /*
alert-destination: samma.alerts.> (consumer alert-destination on
SIEM_ALERTS) -> routing table -> Postgres. The ledger is alert_ledger in the
same database; both tables are created at start.
*/ -}}
{{- $v := .Values.alertDestination -}}
{{- $timeout := include "samma-siem.nanos" $v.messageTimeout | int64 -}}
{{- $ackWait := include "samma-siem.nanos" .Values.consumers.ackWait.alertDestination | int64 -}}
{{- if ge $timeout $ackWait -}}
{{- fail (printf "alertDestination.messageTimeout (%s) must be below consumers.ackWait.alertDestination (%s)" $v.messageTimeout .Values.consumers.ackWait.alertDestination) -}}
{{- end -}}
{{- $reserved := list "ALERTDEST_TRANSPORT" "ALERTDEST_NATS_URL" "ALERTDEST_NATS_STREAM" "ALERTDEST_NATS_CONSUMER" "ALERTDEST_POSTGRES_DSN" "ALERTDEST_POSTGRES_DSN_FILE" "ALERTDEST_ROUTES_PATH" "ALERTDEST_ROUTES_PARAM" "ALERTDEST_DAEMON_MESSAGE_TIMEOUT" "ALERTDEST_SLACK_TOKEN_FILE" "ALERTDEST_GITHUB_TOKEN_FILE" -}}
{{- /*
Slack and GitHub tokens come from files, keys slack-token and github-token
of alertDestination.existingSecret. A table that routes to either without
that Secret would refuse to start, so the chart refuses it first.
*/ -}}
{{- $tokenDests := include "samma-siem.alertTokenDestinations" . | fromJsonArray -}}
{{- if and $tokenDests (not $v.existingSecret) -}}
{{- fail (printf "alertDestination routes to %s (alertDestination.routes or slack.enabled) and needs alertDestination.existingSecret: a Secret with the keys slack-token and github-token, mounted at /var/run/secrets/alert-destination" (join " and " $tokenDests)) -}}
{{- end -}}
{{- $routes := include "samma-siem.workloadName" (dict "root" . "suffix" "alert-routes") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "samma-siem.workloadName" (dict "root" . "suffix" "alert-destination") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" . | nindent 4 }}
    app.kubernetes.io/component: alert-destination
  annotations:
    {{- include "samma-siem.argocdWorkloadWave" . | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "samma-siem.selectorLabels" (dict "root" . "component" "alert-destination") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "samma-siem.labels" . | nindent 8 }}
        app.kubernetes.io/component: alert-destination
      annotations:
        # The table is read once at start: a change rolls the pods.
        checksum/routes: {{ include (print $.Template.BasePath "/alert-routes-configmap.yaml") . | sha256sum }}
        {{- with .Values.workloads.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "samma-siem.workloadPodSpec" . | nindent 6 }}
      # Above the message timeout, so an alert in flight can finish.
      terminationGracePeriodSeconds: {{ add (include "samma-siem.seconds" $v.messageTimeout) 10 }}
      containers:
        - name: alert-destination
          image: {{ include "samma-siem.workloadImage" (dict "name" "alertDestination" "values" $v) }}
          imagePullPolicy: {{ $v.pullPolicy }}
          env:
            - name: ALERTDEST_TRANSPORT
              value: nats
            - name: ALERTDEST_NATS_URL
              value: {{ include "samma-siem.natsUrl" . | quote }}
            - name: ALERTDEST_NATS_STREAM
              value: SIEM_ALERTS
            - name: ALERTDEST_NATS_CONSUMER
              value: alert-destination
            - name: ALERTDEST_POSTGRES_DSN_FILE
              value: /var/run/secrets/siem-postgres/dsn
            - name: ALERTDEST_ROUTES_PATH
              value: /etc/alert-destination/routes.yaml
            - name: ALERTDEST_DAEMON_MESSAGE_TIMEOUT
              value: {{ $v.messageTimeout | quote }}
            {{- if $v.existingSecret }}
            # Both, whatever the table routes to: alert-destination builds
            # Slack or GitHub only when a route names it and ignores the
            # other file, so an unrouted key may be missing from the Secret.
            - name: ALERTDEST_SLACK_TOKEN_FILE
              value: /var/run/secrets/alert-destination/slack-token
            - name: ALERTDEST_GITHUB_TOKEN_FILE
              value: /var/run/secrets/alert-destination/github-token
            {{- end }}
            {{- with include "samma-siem.extraEnv" (dict "env" $v.env "reserved" $reserved "what" "alertDestination.env") | trim }}{{ . | nindent 12 }}{{ end }}
          securityContext:
            {{- include "samma-siem.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: routes
              mountPath: /etc/alert-destination
              readOnly: true
            - name: postgres
              mountPath: /var/run/secrets/siem-postgres
              readOnly: true
            {{- if $v.existingSecret }}
            # The whole Secret, never a subPath, so a rotated token reaches
            # the file and is picked up without a restart.
            - name: tokens
              mountPath: /var/run/secrets/alert-destination
              readOnly: true
            {{- end }}
      volumes:
        - name: routes
          configMap:
            name: {{ $routes }}
        - name: postgres
          secret:
            secretName: {{ include "samma-siem.postgresSecret" . }}
            items:
              - key: {{ .Values.postgres.dsnKey }}
                path: dsn
        {{- if $v.existingSecret }}
        - name: tokens
          secret:
            secretName: {{ $v.existingSecret }}
        {{- end }}
{{- end }}
