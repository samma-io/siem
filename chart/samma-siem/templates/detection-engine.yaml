{{- if .Values.detectionEngine.enabled }}
{{- /*
One detection-engine per lane: samma.logs.<lane> (consumer
detection-engine-<lane> on SIEM_LOGS, created by the streams Job) ->
Sigma rules -> samma.alerts.<lane>.
*/ -}}
{{- $v := .Values.detectionEngine -}}
{{- $image := include "samma-siem.workloadImage" (dict "name" "detectionEngine" "values" $v) -}}
{{- $nats := include "samma-siem.natsUrl" . -}}
{{- $reserved := list "ENGINE_LOG_SOURCE" "ENGINE_TRANSPORT" "ENGINE_NATS_URL" "ENGINE_NATS_STREAM" "ENGINE_NATS_CONSUMER" "ENGINE_NATS_SUBJECT" "ENGINE_RULES_DIR" "ENGINE_WORKERS" "ENGINE_VISIBILITY_TIMEOUT" "ENGINE_METRICS_ADDR" -}}
{{- range $lane := include "samma-siem.lanes" . | fromJsonArray }}
{{- $name := include "samma-siem.workloadName" (dict "root" $ "suffix" (printf "detection-engine-%s" $lane.name)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" $ | nindent 4 }}
    app.kubernetes.io/component: detection-engine
    siem.samma.io/instance: {{ $lane.name }}
  annotations:
    {{- include "samma-siem.argocdWorkloadWave" $ | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "samma-siem.selectorLabels" (dict "root" $ "component" "detection-engine" "instance" $lane.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "samma-siem.labels" $ | nindent 8 }}
        app.kubernetes.io/component: detection-engine
        siem.samma.io/instance: {{ $lane.name }}
      {{- with $.Values.workloads.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "samma-siem.workloadPodSpec" $ | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: {{ $image }}
          imagePullPolicy: {{ $v.pullPolicy }}
          env:
            - name: ENGINE_LOG_SOURCE
              value: {{ $lane.name | quote }}
            - name: ENGINE_TRANSPORT
              value: nats
            - name: ENGINE_NATS_URL
              value: {{ $nats | quote }}
            - name: ENGINE_NATS_STREAM
              value: SIEM_LOGS
            - name: ENGINE_NATS_CONSUMER
              value: {{ printf "detection-engine-%s" $lane.name | quote }}
            - name: ENGINE_NATS_SUBJECT
              value: {{ printf "samma.logs.%s" $lane.name | quote }}
            - name: ENGINE_RULES_DIR
              value: /rules
            - name: ENGINE_WORKERS
              value: {{ $v.workers | quote }}
            # Equals the consumer's AckWait (consumers.ackWait.detectionEngine).
            - name: ENGINE_VISIBILITY_TIMEOUT
              value: {{ $.Values.consumers.ackWait.detectionEngine | quote }}
            {{- with include "samma-siem.extraEnv" (dict "env" $v.env "reserved" $reserved "what" "detectionEngine.env") | trim }}{{ . | nindent 12 }}{{ end }}
          ports:
            - name: admin
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 10
          securityContext:
            {{- include "samma-siem.containerSecurity" $ | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
---
# Health, metrics and /rules of the lane's engine. Inside the cluster only.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" $ | nindent 4 }}
    app.kubernetes.io/component: detection-engine
    siem.samma.io/instance: {{ $lane.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "samma-siem.selectorLabels" (dict "root" $ "component" "detection-engine" "instance" $lane.name) | nindent 4 }}
  ports:
    - name: admin
      port: 9090
      targetPort: admin
{{- end }}
{{- end }}
