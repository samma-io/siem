{{- if .Values.vector.enabled }}
{{- /*
Vector: samma.raw.<lane> (consumer vector-<lane> on SIEM_RAW) -> envelope
VRL -> samma.logs.<lane> (SIEM_LOGS). Rendered only when a lane has raw
records. The config is baked into the image; this selects it.
*/ -}}
{{- $raw := list -}}
{{- range include "samma-siem.lanes" . | fromJsonArray }}{{ if .raw }}{{ $raw = append $raw .name }}{{ end }}{{ end -}}
{{- if $raw }}
{{- $v := .Values.vector }}
{{- /*
With quickwit.enabled the overlays of the image feed this release's
Quickwit: vector-k8s-quickwit.yaml (logs-saas, best-effort) and, with
vector.quickwitAlerts, vector-k8s-quickwit-alerts.yaml (alerts, consumer
vector-alerts-quickwit on SIEM_ALERTS, created by the streams Job).
*/}}
{{- $alerts := include "samma-siem.vectorQuickwitAlerts" . }}
{{- $config := list $v.configPath }}
{{- if .Values.quickwit.enabled }}
{{- $config = append $config "/etc/vector/vector-k8s-quickwit.yaml" }}
{{- if $alerts }}
{{- $config = append $config "/etc/vector/vector-k8s-quickwit-alerts.yaml" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "samma-siem.workloadName" (dict "root" . "suffix" "vector") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
  annotations:
    {{- include "samma-siem.argocdWorkloadWave" . | nindent 4 }}
    # The raw lanes this release expects Vector to read.
    siem.samma.io/raw-lanes: {{ join "," $raw | quote }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "samma-siem.selectorLabels" (dict "root" . "component" "vector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "samma-siem.labels" . | nindent 8 }}
        app.kubernetes.io/component: vector
      {{- with .Values.workloads.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "samma-siem.workloadPodSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: vector
          image: {{ include "samma-siem.workloadImage" (dict "name" "vector" "values" $v) }}
          imagePullPolicy: {{ $v.pullPolicy }}
          args: [{{ range $i, $c := $config }}{{ if $i }}, {{ end }}--config, {{ $c | quote }}{{ end }}]
          env:
            - name: NATS_URL
              value: {{ include "samma-siem.natsUrl" . | quote }}
            {{- if .Values.quickwit.enabled }}
            # The REST base, without /api/v1: the overlays add the path.
            - name: QUICKWIT_URL
              value: {{ include "samma-siem.quickwitUrl" . | quote }}
            {{- end }}
            {{- with include "samma-siem.extraEnv" (dict "env" $v.env "reserved" (list "NATS_URL" "QUICKWIT_URL") "what" "vector.env") | trim }}{{ . | nindent 12 }}{{ end }}
          ports:
            - name: api
              containerPort: 8686
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
          securityContext:
            {{- include "samma-siem.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            # data_dir. Nothing in it needs to survive a restart: the
            # position is the durable consumer's, on the server.
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
{{- end }}
