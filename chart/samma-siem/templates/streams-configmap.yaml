{{- if .Values.streams.enabled }}
{{- /*
One JSON config per stream (stream.<NAME>.json) and per consumer
(consumer.<STREAM>.<name>.json), in the format of `nats stream add --config`
and `nats consumer add --config`. Durations are nanoseconds and sizes bytes.
The fields are what `nats ... add --defaults` with the flags of samma-io/deploy
siem/00-streams-job.yaml creates, so this chart and that Job agree.
*/ -}}
{{- $lanes := include "samma-siem.lanes" . | fromJsonArray -}}
{{- $raw := list -}}
{{- $logs := list -}}
{{- range $lanes -}}
{{- if .raw }}{{ $raw = append $raw (printf "samma.raw.%s" .name) }}{{ end -}}
{{- $logs = append $logs (printf "samma.logs.%s" .name) -}}
{{- end -}}
{{- $s := .Values.streams -}}
{{- $streams := list
  (dict "name" "SIEM_RAW" "subjects" $raw "retention" "limits" "spec" $s.raw "bytes" (include "samma-siem.bytes" $s.raw.maxBytes))
  (dict "name" "SIEM_LOGS" "subjects" $logs "retention" "limits" "spec" $s.logs "bytes" (include "samma-siem.logsMaxBytes" .))
  (dict "name" "SIEM_ALERTS" "subjects" (list "samma.alerts.>") "retention" "limits" "spec" $s.alerts "bytes" (include "samma-siem.bytes" $s.alerts.maxBytes))
  (dict "name" "INGESTER_SLICES" "subjects" (list "samma.ingester.slices.>") "retention" "workqueue" "spec" $s.ingesterSlices "bytes" (include "samma-siem.bytes" $s.ingesterSlices.maxBytes))
-}}
{{- /*
The byte caps of the streams this renders must fit the JetStream file store
of the bundled NATS: fileStore.maxSize, which the nats chart defaults to the
PVC size. Checked only when the chart knows it: nats.enabled with a file
store whose maxSize, or else PVC size, is a plain quantity.
*/ -}}
{{- $sum := 0 -}}
{{- range $streams }}
{{- if .subjects }}{{ $sum = add $sum (.bytes | int64) }}{{ end -}}
{{- if gt (include "samma-siem.nanos" .spec.duplicateWindow | int64) (include "samma-siem.nanos" .spec.maxAge | int64) -}}
{{- fail (printf "%s: duplicateWindow (%s) must not exceed maxAge (%s); JetStream refuses it" .name (toString .spec.duplicateWindow) (toString .spec.maxAge)) -}}
{{- end -}}
{{- end -}}
{{- $js := .Values.nats.config.jetstream | default dict -}}
{{- $fs := $js.fileStore | default dict -}}
{{- $pvc := $fs.pvc | default dict -}}
{{- $limit := "" -}}{{- $what := "" -}}
{{- if $fs.maxSize -}}
{{- $limit = toString $fs.maxSize -}}{{- $what = "nats.config.jetstream.fileStore.maxSize" -}}
{{- else if $pvc.enabled -}}
{{- $limit = toString ($pvc.size | default "") -}}{{- $what = "nats.config.jetstream.fileStore.pvc.size" -}}
{{- end -}}
{{- if and .Values.nats.enabled $js.enabled $fs.enabled $limit -}}
{{- with include "samma-siem.quantityBytes" $limit -}}
{{- if gt ($sum | int64) (. | int64) -}}
{{- fail (printf "the stream byte caps add up to %d MiB, more than the JetStream file store (%s %s): grow the PVC with the caps (streams.*.maxBytes, streams.logs.laneMaxBytes)" (div $sum 1048576) $what $limit) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /*
SIEM_RAW's duplicate window must cover the furthest a Workspace reconcile
pass re-reads: the longest application lookback (6h) plus the source's
reconcile interval. Checked when the interval is a whole number with s, m,
h or d.
*/ -}}
{{- if and .Values.ingester.enabled $raw (has "google-workspace" (.Values.ingester.sources | default list)) -}}
{{- $cfg := get (.Values.ingester.perSource | default dict) "google-workspace" | default dict -}}
{{- $interval := toString (hasKey $cfg "reconcileInterval" | ternary $cfg.reconcileInterval .Values.ingester.reconcileInterval) -}}
{{- if regexMatch "^[0-9]+[smhd]$" $interval -}}
{{- $reach := add (include "samma-siem.nanos" "6h" | int64) (include "samma-siem.nanos" $interval | int64) -}}
{{- if lt (include "samma-siem.nanos" $s.raw.duplicateWindow | int64) ($reach | int64) -}}
{{- fail (printf "streams.raw.duplicateWindow (%s) must cover a Workspace reconcile pass's reach, the 6h longest lookback plus the %s reconcile interval: shorter, records re-read after it are stored again and alert twice (samma-io/ingester#8)" (toString $s.raw.duplicateWindow) $interval) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $c := .Values.consumers -}}
{{- $consumers := list (dict "stream" "SIEM_ALERTS" "name" "alert-destination" "filter" "samma.alerts.>" "ackWait" $c.ackWait.alertDestination) -}}
{{- range $lanes -}}
{{- if .raw }}{{ $consumers = append $consumers (dict "stream" "SIEM_RAW" "name" (printf "vector-%s" .name) "filter" (printf "samma.raw.%s" .name) "ackWait" $c.ackWait.vector) }}{{ end -}}
{{- $consumers = append $consumers (dict "stream" "SIEM_LOGS" "name" (printf "detection-engine-%s" .name) "filter" (printf "samma.logs.%s" .name) "ackWait" $c.ackWait.detectionEngine) -}}
{{- end -}}
{{- range include "samma-siem.vectorQuickwitLanes" . | fromJsonArray -}}
{{- $consumers = append $consumers (dict "stream" "SIEM_LOGS" "name" (printf "vector-quickwit-%s" .) "filter" (printf "samma.logs.%s" .) "ackWait" $c.ackWait.vectorQuickwitLogs) -}}
{{- end -}}
{{- if include "samma-siem.vectorQuickwitAlerts" . -}}
{{- $consumers = append $consumers (dict "stream" "SIEM_ALERTS" "name" "vector-alerts-quickwit" "filter" "samma.alerts.>" "ackWait" $c.ackWait.vectorAlertsQuickwit) -}}
{{- end -}}
{{- range .Values.ingester.sources -}}
{{- if not (regexMatch "^[a-z0-9]+(-[a-z0-9]+)*$" (toString .)) }}{{ fail (printf "ingester source %q: a lowercase name like google-workspace" (toString .)) }}{{ end -}}
{{- $consumers = append $consumers (dict "stream" "INGESTER_SLICES" "name" (printf "ingester-%s" .) "filter" (printf "samma.ingester.slices.%s" .) "ackWait" $c.ackWait.ingester) -}}
{{- end -}}
{{- /*
siem-storage: storage-logs for the postgres backend, storage-s3-logs and
storage-s3-alerts for s3. The two on SIEM_LOGS filter on every lane's log
subject. The S3 consumers hold messages unacked until their object is
written, so they get the service's own max_ack_pending of 10000.
*/ -}}
{{- if .Values.storage.enabled -}}
{{- $backends := include "samma-siem.storageBackends" . | fromJsonArray -}}
{{- if has "postgres" $backends -}}
{{- $consumers = append $consumers (dict "stream" "SIEM_LOGS" "name" "storage-logs" "filters" $logs "ackWait" $c.ackWait.storage) -}}
{{- end -}}
{{- if has "s3" $backends -}}
{{- $flush := include "samma-siem.nanos" .Values.storage.s3.flushInterval | int64 -}}
{{- if le (include "samma-siem.nanos" $c.ackWait.storageS3Logs | int64) $flush -}}
{{- fail (printf "consumers.ackWait.storageS3Logs (%s) must exceed storage.s3.flushInterval (%s)" $c.ackWait.storageS3Logs .Values.storage.s3.flushInterval) -}}
{{- end -}}
{{- $consumers = append $consumers (dict "stream" "SIEM_LOGS" "name" "storage-s3-logs" "filters" $logs "ackWait" $c.ackWait.storageS3Logs "maxAckPending" 10000) -}}
{{- $consumers = append $consumers (dict "stream" "SIEM_ALERTS" "name" "storage-s3-alerts" "filter" "samma.alerts.>" "ackWait" $c.ackWait.storageS3Alerts "maxAckPending" 10000) -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "samma-siem.fullname" . }}-streams
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samma-siem.labels" . | nindent 4 }}
data:
  {{- range $streams }}
  {{- /* A stream with no subjects (every lane raw: false) is not created. */}}
  {{- if .subjects }}
  stream.{{ .name }}.json: |
    {
      "name": {{ .name | quote }},
      "subjects": {{ .subjects | toJson | replace "\\u003e" ">" }},
      "retention": {{ .retention | quote }},
      "max_consumers": -1,
      "max_msgs_per_subject": -1,
      "max_msgs": -1,
      "max_bytes": {{ .bytes }},
      "max_age": {{ include "samma-siem.nanos" .spec.maxAge }},
      "max_msg_size": -1,
      "storage": "file",
      "discard": "old",
      "num_replicas": 1,
      "duplicate_window": {{ include "samma-siem.nanos" .spec.duplicateWindow }},
      "sealed": false,
      "deny_delete": false,
      "deny_purge": false,
      "allow_rollup_hdrs": false,
      "allow_direct": true
    }
  {{- end }}
  {{- end }}
  {{- range $consumers }}
  consumer.{{ .stream }}.{{ .name }}.json: |
    {
      "durable_name": {{ .name | quote }},
      {{- if .filters }}
      "filter_subjects": {{ .filters | toJson | replace "\\u003e" ">" }},
      {{- else }}
      "filter_subject": {{ .filter | quote }},
      {{- end }}
      "ack_policy": "explicit",
      "ack_wait": {{ include "samma-siem.nanos" .ackWait }},
      "max_deliver": {{ $c.maxDeliver | int }},
      "deliver_policy": "all",
      "replay_policy": "instant",
      "max_ack_pending": {{ .maxAckPending | default 1000 | int }},
      "max_waiting": 512
    }
  {{- end }}
  apply.sh: |
    {{- .Files.Get "files/apply-streams.sh" | nindent 4 }}
{{- end }}
